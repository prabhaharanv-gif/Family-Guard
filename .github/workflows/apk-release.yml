# Manually-triggered: builds the debug APK and publishes it as a GitHub
# Release asset, so it can be downloaded directly (not just as a
# time-limited Actions artifact). Never runs on push — dispatch only.
name: Publish debug APK

on:
  workflow_dispatch:
  push:
    branches: [claude/apk-generation-xxib6p]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "VITE_SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder-anon-key}" >> .env

      - name: Build web assets
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debug-apk-run${{ github.run_id }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "FamilyGuard debug APK (run ${{ github.run_number }})" \
            --notes "Automated debug build from commit ${{ github.sha }}. Unsigned/debug build — installable for testing only."
