apply plugin: 'com.android.application'

// Release signing is read from android/keystore.properties, which is gitignored.
// Absent (any clean checkout, CI, or a debug-only build) the release buildType
// simply has no signingConfig and assembleDebug is unaffected — so a missing
// keystore can never break the normal build.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.scoopfamily.familyguard"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.scoopfamily.familyguard"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "1.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Google Maps SDK for Android key, read from android/local.properties
        // (git-ignored) as MAPS_API_KEY=... so it never lands in a tracked file.
        // The key must be restricted to this package + the release, debug and
        // Play app-signing SHA-1s. Missing key: the build still succeeds and the
        // Map tab shows a blank grid; the rest of the app is unaffected.
        def localProps = new Properties()
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
        manifestPlaceholders = [MAPS_API_KEY: localProps.getProperty("MAPS_API_KEY", "")]
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile     file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias      keystoreProperties["keyAlias"]
                keyPassword   keystoreProperties["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        // ── Tester APK — release in every respect except SEND_SMS ───────────
        // Google Play Protect's enhanced fraud protection (live in India)
        // refuses to install a SIDELOADED app that declares SMS, call-log,
        // accessibility or notification-listener permissions. The dialog it
        // shows has only an OK button — there is no "install anyway" — so a
        // tester who will not turn Play Protect off simply cannot take the
        // release APK. Installs from the Play Store are exempt, so this never
        // affects real users; it only blocks handing an APK around.
        //
        // src/sideload/AndroidManifest.xml strips SEND_SMS back out, which puts
        // the build below Play Protect's threshold. Offline SMS alerts are
        // therefore dead on this variant: OfflineSms.hasPermission() stays
        // false and the toggle in Reliability Setup will not take. Everything
        // else — location, SOS, calls, push — is the release build.
        //
        // Same applicationId as release on purpose: google-services.json is
        // keyed to it, and keeping it identical means this APK updates an
        // existing install in place instead of sitting beside it.
        // Named 'sideload', not 'testers': AGP rejects any buildType whose
        // name starts with 'test' ("BuildType names cannot start with 'test'")
        // because that collides with the test source sets. Build it with
        // build.ps1 -Testers, which runs assembleSideload.
        sideload {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Shows as "1.2.1-sideload (18)" in the app, so a tester can say
            // which APK they are on without digging through Settings.
            versionNameSuffix '-sideload'
            // capacitor-android and the cordova plugin bridge only define
            // debug and release. Without this, AGP cannot resolve a 'testers'
            // variant of either and the build fails before it starts.
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ── Firebase Cloud Messaging — required for background SOS notifications ──
    implementation platform('com.google.firebase:firebase-bom:33.8.0')
    implementation 'com.google.firebase:firebase-messaging'

    // ── Crashlytics — native crash + ANR reporting from real devices ─────────
    // ANRs matter most here: an OEM killing LocationForegroundService, or the
    // SOS siren blocking the main thread, surfaces as an ANR in the field on
    // handsets we do not own.
    implementation 'com.google.firebase:firebase-crashlytics'

    // Fused Location Provider — required for LocationForegroundService
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Must come after google-services — Crashlytics reads its config.
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
